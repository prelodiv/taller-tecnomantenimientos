# Backend gratis en Render + base PostgreSQL persistente externa (Neon).
# En Render: New > Blueprint > conecta este repo y se despliega solo.
services:
  - type: web
    name: taller-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      - key: Database__SeedDemo
        value: "false"
      - key: ConnectionStrings__Postgres
        sync: false
